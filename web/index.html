<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NSE Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>NSE Scanner</h1>
      <p id="meta" class="muted">Loading…</p>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Refresh data" title="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section id="breadth" class="breadth" aria-label="Market breadth"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="opps" aria-selected="true">Opportunities</button>
    <button role="tab" data-tab="watch" aria-selected="false">Watchlist</button>
    <button role="tab" data-tab="all" aria-selected="false">All stocks</button>
  </nav>

  <section class="filters">
    <input id="search" type="search" placeholder="Search symbol or name" autocomplete="off">
    <div class="filter-row">
      <div class="seg" id="bias" role="group" aria-label="Direction">
        <button data-bias="all" class="on">All</button>
        <button data-bias="bull">Bullish</button>
        <button data-bias="bear">Bearish</button>
      </div>
      <select id="signal" aria-label="Signal type"><option value="">Any signal</option></select>
      <select id="sector" aria-label="Sector"><option value="">All sectors</option></select>
      <select id="sort" aria-label="Sort by">
        <option value="score">Sort: Score</option>
        <option value="chg">Sort: % change</option>
        <option value="volRatio">Sort: Volume ×</option>
        <option value="rsi">Sort: RSI</option>
        <option value="quality">Sort: Quality</option>
      </select>
    </div>
  </section>

  <main id="list" class="list" aria-live="polite"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="d-title">
      <header class="sheet-head">
        <button class="icon-btn" id="close" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="grow">
          <h2 id="d-title"></h2>
          <p id="d-sub" class="muted"></p>
        </div>
        <button class="icon-btn star" id="d-star" aria-label="Toggle watchlist"></button>
      </header>
      <div id="d-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
